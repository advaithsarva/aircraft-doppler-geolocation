[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aircraft-doppler-geolocation"
version = "0.1.0"
description = "Consent-based aircraft Doppler acoustic geolocation research"
authors = [{name = "Sarva Advaith Narayana"}]
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pyproj>=3.6", "soundfile>=0.12", "polars>=1.0", "pyarrow>=15", "duckdb>=1.0"]

[project.optional-dependencies]
app = ["streamlit>=1.40", "plotly>=5.20", "rasterio>=1.3"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.9", "mypy>=1.14"]

[project.scripts]
doppler-geo = "doppler_geo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
